name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore E-Tab.sln

      - name: Build
        run: dotnet build E-Tab.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project tests\E-Tab.Tests\E-Tab.Tests.csproj -c Release --no-build

      - name: Package
        shell: pwsh
        run: .\pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: E-Tab-win64
          path: |
            artifacts/E-Tab-*-win64.zip
            artifacts/E-Tab-*-win64.zip.sha256
            artifacts/E-Tab-*-win64.exe
